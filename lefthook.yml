pre-commit:
  commands:
    format:
      glob: "*.{astro,ts,mjs,js,css,json,yml,yaml,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    format-check:
      run: npm run format:check
    check:
      run: npm run check
    test:
      run: npm run test
    build:
      run: npm run build
